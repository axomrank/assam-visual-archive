<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Explore Assam through portraits, illustrated scenes, objects and photographs.">
<title>Assam Visual Archive · AxomRank</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="gallery.js"></script>
</head>
<body>
<header><a href="./">AXOMRANK / ARCHIVE</a><a href="#catalogue">Explore the collection ↓</a></header>
<main>
  <section class="hero">
    <div><p class="eyebrow">THE VISUAL COLLECTION</p><h1>Assam<span>.</span></h1>
    <p>Places, people and material culture, gathered into a visual archive.</p></div>
  </section>
  <section id="catalogue" class="catalogue">
    <h2>Browse the archive</h2>
    <form role="search">
      <label>Search<input id="search" type="search" placeholder="Try Rang Ghar or weaving"></label>
      <label>Category<select id="section"><option value="">All categories</option></select></label>
      <label>Collection<select id="collection"><option value="">All collections</option></select></label>
    </form>
    <p id="status" role="status">Loading the catalogue…</p>
    <div id="gallery"></div>
    <button id="more" hidden>Show more</button>
  </section>
</main>
<footer>AxomRank · Assam Visual Archive</footer>
<dialog id="details"><form method="dialog"><button aria-label="Close details">Close ×</button></form><div id="detail-content"></div></dialog>
</body>
</html>
